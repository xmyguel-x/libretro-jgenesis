# Crate minima: existe apenas para os jobs de Rust do CI (cargo fmt/clippy/test
# e o cache rust-cache) encontrarem um manifesto valido neste repositorio.
# O core em si e C (retro8_voxel.c) e nao usa Rust.
[package]
name = "retro8_voxel_ci"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
